name: Build iOS

on:
  push:
    branches: [main, internal/fel-integration]
    paths:
      - 'app/PartsStudio/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/PartsStudio/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app/PartsStudio

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # List available Xcode versions and pick the best one
          ls /Applications/Xcode*.app/Contents/Developer/usr/bin/xcodebuild 2>/dev/null | head -5
          # Prefer 16.2 (has bundled simulators), fall back to latest
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | tail -1)/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install iOS Simulator runtime (if needed)
        run: |
          # Check if any iOS simulator runtime is available
          if ! xcrun simctl list runtimes | grep -q "iOS.*Available"; then
            echo "No iOS runtime found, installing..."
            xcodebuild -downloadPlatform iOS || true
            xcrun simctl list runtimes
          else
            echo "iOS runtime available:"
            xcrun simctl list runtimes | grep iOS
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Determine simulator destination
        run: |
          # Find an available iPhone simulator to use as build destination
          SIM_NAME=$(xcrun simctl list devices available | grep iPhone | head -1 | sed 's/^ *//' | sed 's/ (.*//')
          echo "SIM_DEST=platform=iOS Simulator,name=$SIM_NAME" >> $GITHUB_ENV
          echo "Building for: $SIM_NAME"

      - name: Build iOS (Simulator)
        run: |
          xcodebuild build \
            -project PartsStudio.xcodeproj \
            -scheme PartsStudio-iOS \
            -destination "$SIM_DEST" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== COMPILE ERRORS ==="
            grep "error:" /tmp/xcodebuild.log | sort -u | head -50
            exit 1
          fi

      - name: Collect app bundle
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -path "*iphonesimulator*" | head -1)
          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            echo "Found: $APP_PATH"
            mkdir -p build-output
            cp -R "$APP_PATH" build-output/
            cd build-output && zip -r PartsStudio-iOS-Simulator.zip "$APP_NAME"
          else
            echo "App bundle not found"
            exit 1
          fi

      # --- Simulator Testing & Screenshots ---

      - name: Boot simulator
        run: |
          echo "Available simulators:"
          xcrun simctl list devices available | grep iPhone | head -10
          # Pick the first available iPhone
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data['devices'].items(), reverse=True):
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Booting simulator $DEVICE_ID..."
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install app on simulator
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "Installing $APP_PATH..."
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

      - name: Launch app and capture screenshots
        run: |
          mkdir -p screenshots

          # Set a clean status bar for screenshots
          xcrun simctl status_bar "$DEVICE_ID" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --cellularMode active \
            --cellularBars 4 \
            --wifiBars 3 2>/dev/null || true

          # Launch the app
          echo "Launching Parts Studio..."
          xcrun simctl launch "$DEVICE_ID" parts.studio.ios
          sleep 5

          # Screenshot 1: Initial view (Datasheets tab)
          echo "Capturing: Initial view"
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/01-initial-view.png

          # Record a short video (3 seconds) to show the app running
          echo "Recording short video..."
          xcrun simctl io "$DEVICE_ID" recordVideo --time 3 screenshots/app-demo.mp4 2>/dev/null &
          RECORD_PID=$!
          sleep 4
          kill $RECORD_PID 2>/dev/null || true

          echo "Screenshots and recording captured:"
          ls -la screenshots/

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true

      # --- Upload artifacts ---

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: parts-studio-ios-simulator
          path: app/PartsStudio/build-output/PartsStudio-iOS-Simulator.zip
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: |
            app/PartsStudio/screenshots/*.png
            app/PartsStudio/screenshots/*.mp4
          retention-days: 30
